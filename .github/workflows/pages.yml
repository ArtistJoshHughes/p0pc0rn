# Publishes p0pc0rn to GitHub Pages: https://artistjoshhughes.github.io/p0pc0rn/
# Repository Settings > Pages > Build and deployment > Source = "GitHub Actions".
# The site is the repository root as plain static files (no build step), minus the developer tools and this workflow.
# The model packs are not here: the phone downloads them from Hugging Face (config.js).
# Actions are pinned to the commit of their release (verified on each action's official repository).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Collect the site files
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' --exclude '_site' ./ _site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
